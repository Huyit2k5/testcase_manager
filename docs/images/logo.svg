<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">Test Case Management</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="url(#shine)"/>

  <!-- sheet -->
  <g filter="url(#soft)">
    <rect x="56" y="44" width="144" height="176" rx="20" fill="#ffffff"/>
  </g>
  <!-- clip -->
  <rect x="94" y="32" width="68" height="28" rx="12" fill="#1e3a8a"/>
  <rect x="108" y="38" width="40" height="10" rx="5" fill="#93c5fd"/>

  <!-- row 1: passed -->
  <rect x="76" y="78" width="30" height="30" rx="9" fill="#16a34a"/>
  <path d="M83 93.5l6.5 6.5 11-13" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="86" width="64" height="14" rx="7" fill="#cbd5e1"/>

  <!-- row 2: passed -->
  <rect x="76" y="120" width="30" height="30" rx="9" fill="#16a34a"/>
  <path d="M83 135.5l6.5 6.5 11-13" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="128" width="50" height="14" rx="7" fill="#cbd5e1"/>

  <!-- row 3: failed -->
  <rect x="76" y="162" width="30" height="30" rx="9" fill="#ef4444"/>
  <path d="M85.5 171.5l11 11M96.5 171.5l-11 11" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
  <rect x="118" y="170" width="58" height="14" rx="7" fill="#cbd5e1"/>
</svg>
